services:
  - type: web
    name: acostaspool-web
    runtime: node
    plan: starter
    healthCheckPath: /api/health
    buildCommand: |
      set -e
      npm install --include=dev
      npx prisma generate
      npx playwright install chromium
      npm run build
    preDeployCommand: |
      # If every attempt fails the deploy must stop here: going live with a
      # build whose Prisma client expects columns the database does not have
      # breaks every page that touches those tables.
      # One-off repair for the 18 Sep 2026 incident: the index migration of the
      # main-based branch failed in production (duplicate indexes) and a failed
      # migration blocks every later "migrate deploy". Marking it rolled back
      # lets the (now idempotent) migration run again; when it is not in a
      # failed state the CLI just errors and that error is ignored. Safe to
      # remove once production is migrated.
      npx prisma migrate resolve --rolled-back 20260916235800_add_missing_indexes || true
      migrated=0
      for i in 1 2 3; do
        if npx prisma migrate deploy; then migrated=1; break; fi
        echo "Prisma migrate deploy failed (attempt $i). Retrying in 5s..."
        sleep 5
      done
      if [ "$migrated" != "1" ]; then
        echo "Prisma migrate deploy failed after 3 attempts: aborting the deploy (previous version stays live)."
        exit 1
      fi
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      # Required: the server refuses to start in production without these three
      # (validated by src/lib/config/env.ts from src/instrumentation.ts).
      - key: DATABASE_URL
        fromDatabase:
          name: acostaspool-db
          property: connectionString
      - key: AUTH_SECRET
        sync: false
      - key: APP_URL
        value: https://acostaspool.com
      # File storage: with STORAGE_DRIVER=s3 every AWS_* variable is required.
      - key: STORAGE_DRIVER
        value: s3
      - key: NEXT_PUBLIC_CDN_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Google Maps: browser key (address autocomplete) and server key
      # (geocoding / route assistant). Keep them as two different keys.
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      # Transactional e-mail.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Inbox for quote requests and public-integration replies (defaults to SMTP_USER).
      - key: CONTACT_INBOX_EMAIL
        sync: false
      # Shared secret between the cron worker and the internal endpoints.
      - key: CRON_SECRET
        sync: false
      # Stripe: secret API key and the signing secret of /api/webhooks/stripe.
      # Without them the online checkout, memberships and the reconcile task are
      # disabled and the webhook rejects every event.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Proxies in front of the app: Render terminates TLS on one, so the client
      # address is the last entry of x-forwarded-for. Raise it by one for every
      # extra layer (for example a CDN) or rate limiting can be bypassed with a
      # forged header.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Comma-separated tokens for /new-integrations/<token>. Unset, the app
      # falls back to the token hard-coded in the source; set it and rotate.
      - key: PUBLIC_INTEGRATION_TOKENS
        sync: false
      # Realtime notifications (Pusher). Without the four server variables the
      # app falls back to an in-memory bus that only reaches browsers connected
      # to the same instance. The NEXT_PUBLIC_* pair is inlined into the browser
      # bundle at build time and must match PUSHER_KEY / PUSHER_CLUSTER.
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: PUSHER_CLUSTER
        sync: false
      - key: NEXT_PUBLIC_PUSHER_KEY
        sync: false
      - key: NEXT_PUBLIC_PUSHER_CLUSTER
        sync: false
      # IANA time zone for scheduling, digests and reports.
      - key: BUSINESS_TIMEZONE
        value: America/New_York

  - type: worker
    name: acostaspool-cron-worker
    runtime: node
    plan: starter
    buildCommand: |
      set -e
      npm install --include=dev
      npx prisma generate
    startCommand: npm run worker:cron
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: acostaspool-db
          property: connectionString
      - key: APP_URL
        value: https://acostaspool.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CONTACT_INBOX_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
      # Server-side integrations shared with the web service so that a worker
      # built on the src/ modules (Pusher publishing, geocoding, business time
      # zone) works without extra dashboard changes. scripts/cron-worker.ts
      # currently reads only DATABASE_URL, APP_URL, CRON_SECRET and SMTP_*; the
      # Stripe work runs in the web service behind /api/internal/stripe/reconcile.
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: PUSHER_CLUSTER
        sync: false
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false
      - key: BUSINESS_TIMEZONE
        value: America/New_York
      # Kept from the pre-integration worker config: not read by the current
      # worker (Stripe runs in the web service) but left in place so a future
      # worker-side Stripe call does not need a dashboard change.
      - key: STRIPE_SECRET_KEY
        sync: false

databases:
  - name: acostaspool-db
    # Must match the plan the database actually runs on: Render refuses a
    # Blueprint sync that would downgrade it ("cannot downgrade database from
    # Basic-256mb to Free", seen on 18 Sep 2026 while the file still said
    # `free`). basic-256mb keeps daily backups and point-in-time recovery.
    plan: basic-256mb
    databaseName: acostaspool

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acostas
          POSTGRES_PASSWORD: acostas
          POSTGRES_DB: acostaspool
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acostas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://acostas:acostas@localhost:5432/acostaspool
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
      STORAGE_DRIVER: local
      BUSINESS_TIMEZONE: America/New_York
      SEED_ADMIN_EMAIL: admin@acostaspool.test
      SEED_ADMIN_PASSWORD: Admin123!
      SEED_TECH_EMAIL: tech@acostaspool.test
      SEED_TECH_PASSWORD: Tech123!
      SEED_CUSTOMER_EMAIL: cliente@acostaspool.test
      SEED_CUSTOMER_PASSWORD: Client123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E smoke
        # playwright.config.ts starts `next start` itself when CI is set and
        # waits for /api/health, failing the job if the server never comes up.
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
